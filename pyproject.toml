[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dafnyrag"
version = "0.1.0"
description = "Dafny code repair via retrieval-augmented generation and iterative verification."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
